<svg xmlns="http://www.w3.org/2000/svg" width="270" height="540" viewBox="0 0 270 540" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <title>Phone showing a device repair being tracked</title>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c6f0dc"/><stop offset="1" stop-color="#fdefb5"/></linearGradient>
    <filter id="sh" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#04150f" flood-opacity="0.45"/></filter>
  </defs>
  <rect x="10" y="10" width="250" height="520" rx="38" fill="#e9f1ec" filter="url(#sh)"/>
  <rect x="20" y="20" width="230" height="500" rx="30" fill="#ffffff"/>
  <rect x="100" y="28" width="70" height="8" rx="4" fill="#d5e2da"/>
  <!-- header -->
  <rect x="20" y="44" width="230" height="96" fill="url(#hdr)"/>
  <text x="38" y="78" fill="#4d6357" font-size="12">My devices</text>
  <text x="38" y="104" fill="#1d2b24" font-size="20" font-weight="700">Pixel 6</text>
  <text x="38" y="124" fill="#4d6357" font-size="11">Battery drains within 2 hours</text>
  <rect x="172" y="88" width="62" height="22" rx="11" fill="#ffffff"/>
  <text x="203" y="103" fill="#4a3104" font-size="10.5" font-weight="700" text-anchor="middle">In repair</text>
  <!-- timeline -->
  <text x="38" y="170" fill="#1d2a22" font-size="13" font-weight="700">Progress</text>
  <line x1="49" y1="190" x2="49" y2="366" stroke="#d5e2da" stroke-width="3"/>
  <line x1="49" y1="190" x2="49" y2="306" stroke="#2FA37A" stroke-width="3"/>
  <g font-size="12">
    <circle cx="49" cy="192" r="8" fill="#2FA37A"/><path d="M45 192 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="68" y="190" fill="#1d2a22" font-weight="600">Submitted</text><text x="68" y="205" fill="#7a8b80" font-size="10">Mon, 9:12 AM</text>
    <circle cx="49" cy="250" r="8" fill="#2FA37A"/><path d="M45 250 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="68" y="248" fill="#1d2a22" font-weight="600">Dropped off at Block E</text><text x="68" y="263" fill="#7a8b80" font-size="10">Mon, 2:40 PM</text>
    <circle cx="49" cy="308" r="9" fill="#F0B94A"/><circle cx="49" cy="308" r="4" fill="#fff"/>
    <text x="68" y="306" fill="#1d2a22" font-weight="600">Volunteer is repairing</text><text x="68" y="321" fill="#7a8b80" font-size="10">"Replacing the battery"</text>
    <circle cx="49" cy="366" r="8" fill="#ffffff" stroke="#c4d4ca" stroke-width="3"/>
    <text x="68" y="364" fill="#9aaba0" font-weight="600">Ready for collection</text>
  </g>
  <!-- points card -->
  <rect x="34" y="398" width="202" height="62" rx="14" fill="#fff6d6"/>
  <text x="50" y="424" fill="#4d6357" font-size="11">If repaired you earn</text>
  <text x="50" y="446" fill="#1d2b24" font-size="18" font-weight="800">+210 points</text>
  <circle cx="208" cy="429" r="16" fill="#2FA37A"/><text x="208" y="434" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">×2</text>
  <rect x="34" y="474" width="202" height="30" rx="15" fill="#a6e7c8"/>
  <text x="135" y="494" fill="#1d2b24" font-size="12" font-weight="700" text-anchor="middle">View timeline</text>
</svg>
