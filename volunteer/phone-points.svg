<svg xmlns="http://www.w3.org/2000/svg" width="270" height="540" viewBox="0 0 270 540" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <title>Phone showing points and cashback rewards</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0B94A"/><stop offset="1" stop-color="#2FA37A"/></linearGradient>
    <filter id="sh2" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#04150f" flood-opacity="0.45"/></filter>
  </defs>
  <rect x="10" y="10" width="250" height="520" rx="38" fill="#e9f1ec" filter="url(#sh2)"/>
  <rect x="20" y="20" width="230" height="500" rx="30" fill="#ffffff"/>
  <rect x="100" y="28" width="70" height="8" rx="4" fill="#d5e2da"/>
  <text x="38" y="72" fill="#1d2a22" font-size="17" font-weight="700">Rewards</text>
  <!-- points ring -->
  <circle cx="135" cy="150" r="62" fill="none" stroke="#eef3ef" stroke-width="14"/>
  <circle cx="135" cy="150" r="62" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-dasharray="290 400" transform="rotate(-90 135 150)"/>
  <text x="135" y="152" fill="#1d2b24" font-size="30" font-weight="800" text-anchor="middle">240</text>
  <text x="135" y="172" fill="#7a8b80" font-size="11" text-anchor="middle">points</text>
  <!-- rewards list -->
  <g font-size="12">
    <rect x="34" y="236" width="202" height="50" rx="12" fill="#f4f8f5"/>
    <text x="50" y="258" fill="#1d2a22" font-weight="700">RM2 cashback</text><text x="50" y="275" fill="#7a8b80" font-size="10">100 points</text>
    <rect x="170" y="249" width="54" height="24" rx="12" fill="#a6e7c8"/><text x="197" y="265" fill="#1d2b24" font-size="10.5" font-weight="700" text-anchor="middle">Redeem</text>
    <rect x="34" y="294" width="202" height="50" rx="12" fill="#f4f8f5"/>
    <text x="50" y="316" fill="#1d2a22" font-weight="700">RM5 cashback</text><text x="50" y="333" fill="#7a8b80" font-size="10">240 points</text>
    <rect x="170" y="307" width="54" height="24" rx="12" fill="#a6e7c8"/><text x="197" y="323" fill="#1d2b24" font-size="10.5" font-weight="700" text-anchor="middle">Redeem</text>
    <rect x="34" y="352" width="202" height="50" rx="12" fill="#f4f8f5"/>
    <text x="50" y="374" fill="#9aaba0" font-weight="700">RM10 cashback</text><text x="50" y="391" fill="#9aaba0" font-size="10">460 points</text>
    <text x="200" y="381" fill="#9aaba0" font-size="10" text-anchor="middle">220 more</text>
  </g>
  <!-- challenge -->
  <rect x="34" y="418" width="202" height="82" rx="14" fill="#fdefb5"/>
  <text x="50" y="442" fill="#9a6400" font-size="11" font-weight="700">Challenge running</text>
  <text x="50" y="462" fill="#1d2b24" font-size="14" font-weight="700">Month of Repair</text>
  <rect x="50" y="474" width="170" height="8" rx="4" fill="#f8de8a"/>
  <rect x="50" y="474" width="109" height="8" rx="4" fill="#3fb37f"/>
  <text x="220" y="494" fill="#6b5a2a" font-size="10" text-anchor="end">3.2 of 5 kg</text>
</svg>
